<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<title>پیام ارسال شد</title>

<style>

*{
    box-sizing:border-box;
    font-family:tahoma;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#07070a;
}


.alert{

    width:380px;
    background:#111827;
    color:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.5);

    animation:show .4s ease;

}


.content{

    display:flex;
    align-items:center;
    gap:15px;
    padding:25px;

}


.icon{

    font-size:40px;

}


h2{

    margin:0;
    font-size:20px;

}


p{

    margin-top:8px;
    color:#cbd5e1;

}



.timeline{

    height:5px;
    width:100%;
    background:#1f2937;

}


.line{

    height:100%;
    width:100%;
    background:linear-gradient(90deg,#8b5cf6,#3b82f6);

    animation:time 3s linear forwards;

}



@keyframes time{

    from{
        width:100%;
    }

    to{
        width:0%;
    }

}


@keyframes show{

    from{
        opacity:0;
        transform:translateY(-30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


</style>

</head>


<body>


<div class="alert">

    <div class="content">

        <div class="icon">
            ✅
        </div>


        <div>

            <h2>
                پیام ارسال شد
            </h2>

            <p>
                پیام شما با موفقیت ارسال شد.
            </p>

        </div>

    </div>


    <div class="timeline">

        <div class="line"></div>

    </div>


</div>



<script>


setTimeout(()=>{


    window.location.href="index.html";


},3000);



</script>


</body>
  </html>

</html>
