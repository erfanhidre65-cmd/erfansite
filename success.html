<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<title>پیام ارسال شد</title>

<style>

*{
    box-sizing:border-box;
    font-family:tahoma;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#07070a;
}


.alert{

    width:380px;
    background:#111827;
    color:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.5);

    animation:show .4s ease;

}


.content{

    display:flex;
    align-items:center;
    gap:15px;
    padding:25px;

}


.icon{

    font-size:40px;

}


h2{

    margin:0;
    font-size:20px;

}


p{

    margin-top:8px;
    color:#cbd5e1;

}



.timeline{

    height:5px;
    width:100%;
    background:#1f2937;

}


.line{

    height:100%;
    width:100%;
    background:linear-gradient(90deg,#8b5cf6,#3b82f6);

    animation:time 3s linear forwards;

}



@keyframes time{

    from{
        width:100%;
    }

    to{
        width:0%;
    }

}


@keyframes show{

    from{
        opacity:0;
        transform:translateY(-30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}
    .loader-box{
    position:relative;
    width:60px;
    height:60px;
    margin:0 auto 20px;
}


.progress-ring{
    transform:rotate(-90deg);
}


.ring-bg{

    fill:none;
    stroke:#1f2937;
    stroke-width:4;

}


.ring-progress{

    fill:none;
    stroke:#22c55e;
    stroke-width:4;
    stroke-linecap:round;

    stroke-dasharray:157;
    stroke-dashoffset:157;

    animation:loading 3s linear forwards;

}


.check-icon{

    position:absolute;
    top:16px;
    left:16px;

    opacity:0;

    animation:showCheck .3s ease forwards;
    animation-delay:3s;

}



@keyframes loading{

    from{
        stroke-dashoffset:157;
    }

    to{
        stroke-dashoffset:0;
    }

}



@keyframes showCheck{

    from{
        opacity:0;
        transform:scale(.5);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}


</style>

</head>


<body>


<div class="alert">

    <div class="content">

        <div class="icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
     stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    
    <circle cx="12" cy="12" r="10" fill="rgba(34,197,94,0.15)"></circle>
    
    <polyline points="9 12 11.5 14.5 16 9"></polyline>

</svg>
        </div>


        <div>

            <h2>
                پیام ارسال شد
            </h2>

            <p>
                پیام شما با موفقیت ارسال شد.
            </p>

        </div>

    </div>


    <div class="timeline">
        <div class="loader-box">
    <svg class="progress-ring" width="60" height="60">
        <circle class="ring-bg" cx="30" cy="30" r="25"></circle>
        <circle class="ring-progress" cx="30" cy="30" r="25"></circle>
    </svg>

    <svg class="check-icon" width="28" height="28" viewBox="0 0 24 24" fill="none"
         stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
</div>

        <div class="line"></div>

    </div>


</div>



<script>


setTimeout(()=>{


    window.location.href="index.html";


},3000);



</script>


</body>
  </html>

</html>
