<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider • Venom</title>

    <link rel="stylesheet" href="vi.css">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
</head>

<body>

    <!-- Scroll Progress -->
    <div class="progress">
        <div class="progress-bar"></div>
    </div>

    <!-- Loader -->
    <div class="loader">
        <h1>MARVEL</h1>
    </div>

    <!-- Header -->
    <header>

        <div class="logo">
            SPIDER • VENOM
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Story</a>
            <a href="#">Characters</a>
        </nav>

    </header>

    <!-- Video -->
    <div class="video-container">

        <video
            id="video"
            src="assets/video.mp4"
            muted
            playsinline
            preload="auto"
            style="display:none;">
        </video>

        <canvas id="frames-canvas"></canvas>

        <div class="overlay">

            <div class="neon-frame">

                <svg class="venom-logo"
                     viewBox="0 0 900 220">

                    <defs>

                        <linearGradient id="neonGradient"
                            x1="0%"
                            y1="0%"
                            x2="100%"
                            y2="0%">

                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="20%" stop-color="#ff0000"/>
                            <stop offset="50%" stop-color="#ffffff"/>
                            <stop offset="80%" stop-color="#ff0000"/>
                            <stop offset="100%" stop-color="#ffffff"/>

                            <animateTransform
                                attributeName="gradientTransform"
                                type="translate"
                                from="-1 0"
                                to="1 0"
                                dur="2s"
                                repeatCount="indefinite"/>

                        </linearGradient>

                    </defs>

                    <text
                        x="50%"
                        y="60%"
                        text-anchor="middle">

                        VENOM

                    </text>

                </svg>

            </div>

        </div>

    </div>

    <!-- Scroll Space -->
    <div class="scroll-space"></div>

    <script src="vi.js"></script>

</body>

</html>
