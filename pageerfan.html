<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تعیین نقش</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      @font-face {
        font-family: iran;
        src: url(Far_KamrnBd.ttf);
      }
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        height: 100vh;
        display: flex;
        overflow: hidden;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff0000, #1a1a1a, #2b2b2b);
        /* background-size: 200%; */
      }

      .box {
        width: 350px;
        height: 350px;
        background: rgba(255, 255, 255, 0.08);
        /* padding:30px; */
        display: flex;
        flex-direction: column;
border-radius: 20px;
        position: relative;
        box-shadow: 0 0 20px 3px rgba(255, 255, 255, 0.15);
        text-align: center;
        transition: 1s;
        color: white;
      }
      .box:hover {
        width: 450px;
        /* transform: rotate(-18deg); */
        height: 450px;
        background: rgba(255, 255, 255, 0.08);
        /* padding:30px; */
        border-radius: 100%;
        backdrop-filter: blur(6px);
        box-shadow: 0 0 25px 6px rgba(255, 255, 255, 0.15);
        text-align: center;
        color: white;
      }

      h2 {
        font-family: iran;
        margin-bottom: 25px;
        position: absolute;
        top: 50px;
        font-size: 36px;
      }

      button {
        width: 200px;
        /* box-sizing: border-box; */
        position: absolute;
        height: 200px;
        padding: 32px;
        border-radius: 20px;
        background: #4acf0d;
        border: none;
 
        font-weight: bold;


        color: #000000;
        font-size: 8px;
        cursor: pointer;
        transition: 0.8s;
      }

      button:hover {
        font-size: 18px;
        transform: translate(60px);
        width: 80%;
       
        border-radius: 100%;
        height: 80%;
        background: #11c900;
        z-index: 10;
      }
      h2 {
        color: white;
      }
      button.bt1:hover ~ button.bt2{
        filter: blur(3px);
      }
            button.bt2:hover ~  button.bt1{
        filter: blur(3px);
      }
    </style>
  </head>
  <body>
    <h2></h2>
    <div class="box">
      <button class="bt1"  onclick="shop()"> ورود به فروشگاه (مشتری)</button>
    </div>
    <script>
      function shop() {
        location.href = "pageerfan (2).html";
      }


    </script>
  </body>
</html>
